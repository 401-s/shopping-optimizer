# ── Home Assistant configuratie ───────────────────────────────────────────────
#
# Voeg dit toe aan je configuration.yaml (of een aparte package file)
# om knoppen op je dashboard te maken die de optimizer triggeren.
#
# Vervang JOUW_SERVER_IP door het IP van je Unraid server.
# Vervang JOUW_WEBHOOK_SECRET door dezelfde waarde als WEBHOOK_SECRET in je
# docker-compose.yml (verplicht; de container start niet zonder).
#
# /preview en /optimize antwoorden direct ("gestart") en werken op de achtergrond;
# het resultaat (of een foutmelding) verschijnt als HA-notificatie.

# 1. REST commands — sturen webhooks naar de container
rest_command:
  # Direct optimaliseren zonder bevestiging
  optimize_shopping_list:
    url: "http://JOUW_SERVER_IP:8099/optimize"
    method: POST
    content_type: "application/json"
    headers:
      X-Webhook-Secret: "JOUW_WEBHOOK_SECRET"

  # Stap 1: Vraag Claude een voorstel te maken (geen wijzigingen toegepast)
  preview_shopping_list:
    url: "http://JOUW_SERVER_IP:8099/preview"
    method: POST
    content_type: "application/json"
    headers:
      X-Webhook-Secret: "JOUW_WEBHOOK_SECRET"

  # Stap 2a: Bevestig en pas het voorstel toe (schrijft de lijst terug, kan even duren)
  confirm_shopping_list:
    url: "http://JOUW_SERVER_IP:8099/confirm"
    method: POST
    content_type: "application/json"
    timeout: 60
    headers:
      X-Webhook-Secret: "JOUW_WEBHOOK_SECRET"

  # Stap 2b: Annuleer het voorstel, lijst blijft ongewijzigd
  cancel_shopping_list:
    url: "http://JOUW_SERVER_IP:8099/cancel"
    method: POST
    content_type: "application/json"
    headers:
      X-Webhook-Secret: "JOUW_WEBHOOK_SECRET"

  # Draai de laatste optimalisatie terug
  undo_shopping_list:
    url: "http://JOUW_SERVER_IP:8099/undo"
    method: POST
    content_type: "application/json"
    timeout: 60
    headers:
      X-Webhook-Secret: "JOUW_WEBHOOK_SECRET"

# 2. Scripts — roepen de REST commands aan
script:
  # Direct optimaliseren (zonder bevestiging)
  optimize_shopping_list:
    alias: "Optimaliseer boodschappenlijst (direct)"
    sequence:
      - action: rest_command.optimize_shopping_list

  # Met bevestiging: stap 1 — maak voorstel
  preview_shopping_list:
    alias: "Bekijk optimalisatie-voorstel"
    sequence:
      - action: rest_command.preview_shopping_list

  # Met bevestiging: stap 2a — bevestig voorstel
  confirm_shopping_list:
    alias: "Bevestig optimalisatie"
    sequence:
      - action: rest_command.confirm_shopping_list

  # Met bevestiging: stap 2b — annuleer voorstel
  cancel_shopping_list:
    alias: "Annuleer optimalisatie"
    sequence:
      - action: rest_command.cancel_shopping_list

  # Laatste optimalisatie ongedaan maken
  undo_shopping_list:
    alias: "Maak optimalisatie ongedaan"
    sequence:
      - action: rest_command.undo_shopping_list

# 3. Automation — koppelt de knoppen in de telefoonmelding aan de optimizer
#    Alleen nodig als je NOTIFY_SERVICE instelt in de container.
#    "automation shopping_optimizer:" (met label) botst niet met een bestaande
#    "automation: !include automations.yaml" regel.
automation shopping_optimizer:
  - alias: "Boodschappenlijst optimizer — telefoonknoppen"
    id: shopping_optimizer_phone_actions
    mode: queued
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: SHOPPING_OPTIMIZER_CONFIRM
        id: confirm
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: SHOPPING_OPTIMIZER_CANCEL
        id: cancel
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: SHOPPING_OPTIMIZER_UNDO
        id: undo
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: confirm
            sequence:
              - action: rest_command.confirm_shopping_list
          - conditions:
              - condition: trigger
                id: cancel
            sequence:
              - action: rest_command.cancel_shopping_list
          - conditions:
              - condition: trigger
                id: undo
            sequence:
              - action: rest_command.undo_shopping_list

# ── Dashboard knoppen ─────────────────────────────────────────────────────────
#
# Optie A: Direct optimaliseren (één knop)
#
# type: button
# name: Optimaliseer boodschappenlijst
# icon: mdi:cart-check
# tap_action:
#   action: perform-action
#   perform_action: script.optimize_shopping_list
#
# Optie B: Met bevestiging (drie knoppen op je dashboard)
#
# Knop 1 — Maak voorstel:
# type: button
# name: Bekijk voorstel
# icon: mdi:cart-search
# tap_action:
#   action: perform-action
#   perform_action: script.preview_shopping_list
#
# Knop 2 — Bevestig:
# type: button
# name: Bevestig
# icon: mdi:check-circle
# tap_action:
#   action: perform-action
#   perform_action: script.confirm_shopping_list
#
