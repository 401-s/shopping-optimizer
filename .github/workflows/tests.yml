name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bouw het Docker image (zonder te pushen)
        run: docker build -t shopping-optimizer:ci .
      - name: Start de container en controleer de health check
        run: |
          docker run -d --name so -p 8099:8099 \
            -e HA_URL=http://127.0.0.1:1 -e HA_TOKEN=x \
            -e ANTHROPIC_API_KEY=x -e WEBHOOK_SECRET=ci \
            shopping-optimizer:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/health; then exit 0; fi
            sleep 1
          done
          docker logs so
          exit 1

  # Publiceert ghcr.io/401-s/shopping-optimizer, alleen na een push naar main of een
  # versietag (v1.2.3) én als de tests en de Docker-build geslaagd zijn.
  publish:
    if: github.event_name == 'push'
    needs: [pytest, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main → latest + sha-abc1234; tag v1.2.3 → 1.2.3, 1.2 en sha-abc1234
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
